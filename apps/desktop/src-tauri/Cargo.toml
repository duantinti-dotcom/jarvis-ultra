[package]
name = "jarvis-ultra"
version = "0.2.8"
description = "JARVIS ULTRA — assistente pessoal de IA local"
authors = ["JARVIS ULTRA"]
edition = "2021"

[lib]
name = "jarvis_ultra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
