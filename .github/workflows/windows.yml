name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jarvis/core typecheck
      - run: pnpm --filter @jarvis/core test
      - run: pnpm --filter @jarvis/web typecheck

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: Recursos (core, interface, node.exe verificado)
        run: node apps/desktop/scripts/prepare.mjs --target x86_64-pc-windows-msvc
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Build Tauri (NSIS, assinado para atualização automática quando a chave existe)
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis
          else
            echo "::warning::Sem TAURI_SIGNING_PRIVATE_KEY: instalador gerado sem pacote de atualização automática."
            pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ULTRA-windows
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe*
      - name: Publicar atualização automática (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          [ "$HAS_KEY" = "true" ] || { echo "::error::Configure o segredo TAURI_SIGNING_PRIVATE_KEY para publicar atualizações."; exit 1; }
          V="${GITHUB_REF_NAME#v}"
          EXE=$(ls apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*_${V}_x64-setup.exe)
          git fetch origin main && git checkout main
          node scripts/publish-update.mjs --version "$V" --exe "$EXE" --sig "$EXE.sig" --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | head -c 600)"
          git config user.name "JARVIS release bot"
          git config user.email "actions@github.com"
          git add updates && git commit -m "Atualização automática: versão $V" && git push origin main
